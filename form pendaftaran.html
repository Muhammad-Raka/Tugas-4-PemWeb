<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Mahasiswa</title>

<style>
    body {
        font-family: Arial;
        padding: 30px;
    }

    h1 {
        text-align: center;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    td, th {
        border: 1px solid #ccc;
        padding: 8px;
    }

    input, select {
        width: 95%;
        padding: 5px;
    }

    .center {
        text-align: center;
    }
</style>

</head>
<body>

<p id="tanggal"></p>

<h3 class="center">Form Input Data Mahasiswa</h3>

<table>
<tr>
    <td>NIM:</td>
    <td><input type="text" id="nim" placeholder="Masukkan NIM"></td>
</tr>

<tr>
    <td>Nama:</td>
    <td><input type="text" id="nama" placeholder="Masukkan Nama"></td>
</tr>

<tr>
    <td>Kelas:</td>
    <td><input type="text" id="kelas" placeholder="Masukkan Kelas"></td>
</tr>

<tr>
    <td>Gender:</td>
    <td>
        <input type="radio" name="gender" value="Laki-laki"> Laki-laki
        <input type="radio" name="gender" value="Perempuan"> Perempuan
    </td>x
</tr>

<tr>
    <td>Peminatan:</td>
    <td>
        <select id="peminatan">
            <option value="">-- Pilih Peminatan --</option>
            <option>Data Sains</option>
            <option>Software</option>
            <option>Jaringan</option>
        </select>
    </td>
</tr>

<tr>
    <td colspan="2" class="center">
        <button onclick="tambahData()">Kirim</button>
    </td>
</tr>
</table>

<!-- TABEL DATA -->
<table id="tabelData">
<tr>
    <th>NIM</th>
    <th>Nama</th>
    <th>Kelas</th>
    <th>Gender</th>
    <th>Peminatan</th>
</tr>
</table>

<script>

// Tanggal otomatis
let sekarang = new Date();
document.getElementById("tanggal").innerHTML =
    "Tanggal Hari ini : " + sekarang;

// Fungsi tambah data
function tambahData() {

    let nim = document.getElementById("nim").value;
    let nama = document.getElementById("nama").value;
    let kelas = document.getElementById("kelas").value;
    let peminatan = document.getElementById("peminatan").value;

    let gender = "";
    let radios = document.getElementsByName("gender");
    for (let i = 0; i < radios.length; i++) {
        if (radios[i].checked) {
            gender = radios[i].value;
        }
    }

    // VALIDASI
    if (nim === "" || nama === "" || kelas === "" || gender === "" || peminatan === "") {
        alert("Semua data harus diisi!");
        return;
    }

    // Tambah ke tabel
    let tabel = document.getElementById("tabelData");
    let row = tabel.insertRow();

    row.insertCell(0).innerHTML = nim;
    row.insertCell(1).innerHTML = nama;
    row.insertCell(2).innerHTML = kelas;
    row.insertCell(3).innerHTML = gender;
    row.insertCell(4).innerHTML = peminatan;

    // Reset form
    document.getElementById("nim").value = "";
    document.getElementById("nama").value = "";
    document.getElementById("kelas").value = "";
    document.getElementById("peminatan").value = "";

    for (let i = 0; i < radios.length; i++) {
        radios[i].checked = false;
    }
}

</script>

</body>
</html>
