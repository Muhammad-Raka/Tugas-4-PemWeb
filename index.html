<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Saklar Lampu</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 50px;
        }

        img {
            width: 150px;
            margin: 20px 0;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>SAKLAR LAMPU</h2>

    <!-- Gambar lampu -->
    <img id="lampu" src="https://www.w3schools.com/js/pic_bulboff.gif">

    <br>

    <!-- Tombol -->
    <button onclick="nyala()">Nyalakan Lampu</button>
    <button onclick="mati()">Matikan Lampu</button>

    <script>
        function nyala() {
            document.getElementById("lampu").src =
                "lampu mati.jpeg"
        }

        function mati() {
            document.getElementById("lampu").src =
                "lampu nyala.jpeg";
        }
    </script>

</body>
</html>

<script>
function nyala() {
    let konfirmasi = confirm("Yakin ingin menyalakan lampu?");
    if (konfirmasi) {
        document.getElementById("lampu").src =
            "lampu nyala.jpeg";
    }
}

function mati() {
    let konfirmasi = confirm("Yakin ingin mematikan lampu?");
    if (konfirmasi) {
        document.getElementById("lampu").src =
            "lampu mati.jpeg";
    }
}
</script>
